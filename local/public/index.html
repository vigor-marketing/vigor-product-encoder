<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigor 编码器</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#f3f4f6;margin:0;padding:24px;color:#111827;font-size:16px;line-height:1.6}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{display:inline-block;padding:12px 28px;background:#fff;color:#4b5563;cursor:pointer;border-radius:10px;border:1px solid #e5e7eb;font-size:15px;font-weight:600;transition:all .15s}
.tab:hover{border-color:#93c5fd;color:#2563eb;background:#eff6ff}
.tab.on{color:#fff;background:#2563eb;border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.card{background:#fff;border-radius:12px;padding:20px;margin:10px 0;border:1px solid #e5e7eb;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.btn{display:inline-block;padding:8px 18px;border:1px solid #d1d5db;border-radius:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:500;margin:2px;transition:all .15s;color:#374151}
.btn:hover{background:#f3f4f6;border-color:#9ca3af}
.btb{background:#2563eb;color:#fff;border-color:#2563eb}
.btb:hover{background:#1d4ed8;border-color:#1d4ed8}
.btr{color:#dc2626;border-color:#fca5a5}
.btr:hover{background:#fef2f2}
.bts{background:#16a34a;color:#fff;border-color:#16a34a}
.bts:hover{background:#15803d}
.step{display:flex;margin:6px 0;min-height:52px;align-items:stretch}
.sl{width:190px;padding:12px 14px;background:#1e40af;color:#fff;border-radius:8px 0 0 8px;font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.sl:hover{background:#1e3a8a}
.sl.g{background:#d1d5db;color:#9ca3af;cursor:default;pointer-events:none}
.sr{flex:1;padding:12px 14px;background:#fffbeb;border-radius:0 8px 8px 0;font-size:15px;border:1px solid #fde68a;border-left:none;display:flex;align-items:center;gap:8px;cursor:pointer}
.sr:hover{background:#fef3c7}
.sr.p{color:#d97706;opacity:.7;cursor:default;background:#fffbeb}
.sr.p:hover{background:#fffbeb}
.tg{background:#f59e0b;color:#fff;padding:3px 10px;border-radius:5px;font-family:"SF Mono",Consolas,monospace;font-weight:700;font-size:13px;white-space:nowrap}
.gb{background:#f0fdf4;border:1px solid #bbf7d0;padding:20px;border-radius:12px;margin:10px 0}
.ce{font-family:"SF Mono",Consolas,monospace;font-size:30px;font-weight:700;color:#166534;text-align:center;padding:14px;background:rgba(255,255,255,.95);border-radius:8px;border:1px solid #bbf7d0;word-break:break-all}
.nc{border-left:4px solid #22c55e;padding:10px 12px;background:#fff;border-radius:6px;margin:6px 0;font-size:15px;line-height:1.7}
.g2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.g2>div{background:#fff;border:2px solid #e5e7eb;border-radius:12px;padding:18px;cursor:pointer;text-align:center;position:relative;transition:all .15s}
.g2>div:hover{border-color:#60a5fa;transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.lb{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:10px;color:#fff;font-weight:700;font-size:16px;margin-bottom:8px}
.sc{font-size:13px;color:#9ca3af;margin-top:6px}
.mk{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;z-index:999;padding:20px}
.mk.s{display:flex}
.mw{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.mh{padding:16px 20px;border-bottom:1px solid #e5e7eb;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.mb{padding:20px}
.mf{padding:14px 20px;border-top:1px solid #e5e7eb;text-align:right;background:#f9fafb;border-radius:0 0 14px 14px}
.in{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;margin-bottom:12px;box-sizing:border-box;outline:none}
.in:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fd{margin-bottom:14px}
.fd label{display:block;font-size:14px;font-weight:600;color:#374151;margin-bottom:6px}
.fd input{width:100%;padding:10px 14px;border:1px solid #d1d5db;border-radius:8px;font-size:15px;box-sizing:border-box;outline:none}
.fd input:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.fd .ro{background:#f3f4f6;color:#6b7280}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:8px 0}
.pc{border:1px solid #e5e7eb;border-radius:8px;padding:12px;background:#fafafa}
.pl{font-family:monospace;font-weight:700;font-size:12px;color:#b45309;background:#fef3c7;display:inline-block;padding:2px 8px;border-radius:4px;margin-bottom:4px}
.pn{font-size:14px;color:#374151;margin-bottom:6px}
.pv{font-size:13px;color:#4b5563;background:#f9fafb;border:1px solid #e5e7eb;padding:4px 10px;border-radius:6px;display:inline-block;margin:2px}
.pv code{font-family:"SF Mono",Consolas,monospace;font-weight:700;color:#b45309}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;padding:10px 12px;background:#f9fafb;border-bottom:2px solid #e5e7eb;font-size:13px;font-weight:600;color:#6b7280}
td{padding:10px 12px;border-bottom:1px solid #f3f4f6;font-size:14px}
tr:hover td{background:#f9fafb}
td.fc{font-family:"SF Mono",Consolas,monospace;color:#1d4ed8;font-weight:700}
.ic{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.ic>span{display:inline-block;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:1px solid #e5e7eb;background:#fff;color:#6b7280}
.ic>span:hover{border-color:#93c5fd;color:#2563eb}
.ic>.a{background:#2563eb;color:#fff;border-color:#2563eb}
h2{margin:0 0 10px;font-size:22px;color:#111827}
p{margin:0 0 6px;font-size:15px;color:#6b7280}
input[type="text"],input[type="search"],input{font-size:15px}


.tb{display:inline-block;padding:12px 28px;background:#fff;color:#4b5563;cursor:pointer;border-radius:10px;border:1px solid #e5e7eb;font-size:15px;font-weight:600;transition:all .15s;margin-right:8px}
.tb:hover{border-color:#93c5fd;color:#2563eb;background:#eff6ff}
.tb.on{color:#fff;background:#2563eb;border-color:#2563eb;box-shadow:0 2px 8px rgba(37,99,235,.25)}

/* ===== 手机端适配 ===== */
@media (max-width:768px){
  body{padding:12px}
  .tb,.tab{padding:10px 16px;font-size:14px;margin-right:6px}
  .card{padding:14px}
  .g2{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .g2>div{padding:12px}
  .ic>span{padding:6px 10px;font-size:13px}
}
@media (max-width:520px){
  /* 编码器步骤上下堆叠 */
  .step{flex-direction:column;min-height:auto;margin:8px 0}
  .sl{width:100%;border-radius:8px 8px 0 0;min-height:46px}
  .sr{border-radius:0 0 8px 8px;border-left:1px solid #fde68a;min-height:46px}
  /* 编码器左右布局改为上下 */
  .enc-flex{flex-direction:column !important}
  #en,#pe .gb{min-width:0 !important}
  .ce{font-size:22px}
  .gb{padding:14px}
  /* 按钮适合手指点击 */
  .btn{padding:10px 16px;min-height:42px}
  .lb{width:46px;height:46px;font-size:14px}
  /* 弹窗占满宽度 */
  .mw{width:96%;max-width:96%}
  .mh{padding:12px 14px;font-size:15px}
  .mb{padding:14px}
  .fd input,.in{padding:11px 12px;font-size:16px}
  .fd label{font-size:14px}
  /* 表格字号 */
  th,td{padding:8px;font-size:13px}
  th{font-size:12px}
  /* 面包屑 */
  .ic>span{padding:6px 10px;font-size:12px}
  /* 已保存控制条 */
  #sv>div:first-child{flex-direction:column;align-items:stretch !important;gap:8px}
  #sv>div:first-child .btn{width:100%;margin:2px 0}
}

</style>
</head>

function NC(cs,base){
  // 顺延规则：取已有编码的最大值 +1；无编码时用起始编码 base
  if(!cs||!cs.length)return base||"AA";
  let mx=cs[0];
  for(let i=1;i<cs.length;i++){if(cs[i]>mx)mx=cs[i];}
  if(typeof mx==="string"&&/^[A-Z]{2}$/.test(mx)){
    let c1=mx.charCodeAt(0),c2=mx.charCodeAt(1);
    if(c2<90)return String.fromCharCode(c1)+String.fromCharCode(c2+1);
    if(c1<90)return String.fromCharCode(c1+1)+"A";
  }
  return base||"AA";
}
// 单字母编码：A~Z（标准段、子类段使用），最多 26 个
function NC1(cs,base){
  let mx=-1;
  (cs||[]).forEach(function(c){
    if(typeof c==="string"&&/^[A-Z]$/.test(c)){let n=c.charCodeAt(0)-65;if(n>mx)mx=n;}
  });
  if(mx>=25)return "Z"; // 已满 → 返回顶值，调用方检测重复
  return String.fromCharCode(65+mx+1);
}
// 双字母编码：AA~ZZ（产品段使用），最多 676 个
function NC2(cs,base){
  if(!cs||!cs.length)return base||"AA";
  let mx=-1;
  (cs||[]).forEach(function(c){
    if(typeof c==="string"&&/^[A-Z]{2}$/.test(c)){let n=(c.charCodeAt(0)-65)*26+(c.charCodeAt(1)-65);if(n>mx)mx=n;}
  });
  let next=mx+1;
  if(next>=676)return "ZZ"; // 已满 → 返回顶值，调用方检测重复
  return String.fromCharCode(65+Math.floor(next/26))+String.fromCharCode(65+next%26);
}

        h+=`<button class="btn" onclick="event.stopPropagation();ADO(${MA},${MC},${MP},${i})" style="font-size:12px;padding:3px 8px">+选项</button>`;
        h+=`</div></div>`;
      });
      h+=`</div>`;
    }
    h+=`<div style="text-align:center;margin-top:16px"><button class="btn" onclick="ML=2;MP=-1;RM()">← 返回</button> <button class="btn btb" onclick="ADP(${MA},${MC},${MP})">+ 参数组</button></div>`;
  }
  q("mg").innerHTML=h;
}

// Manage: Edit
function SEAPI(i){SEdit("api",i);}
function DLAPI(i){CF("确定删除该标准及其全部子数据吗？",function(){DATA.splice(i,1);sd();RM();M("已删除");});}
function SECAT(ai,ci){SEdit("cat",ai,ci);}
function DLCAT(ai,ci){CF("确定删除该子类及其全部产品吗？",function(){DATA[ai].categories.splice(ci,1);sd();RM();M("已删除");});}
function SEPROD(ai,ci,pi){SEdit("prod",ai,ci,pi);}
function DLPROD(ai,ci,pi){CF("确定删除该产品吗？",function(){DATA[ai].categories[ci].products.splice(pi,1);sd();RM();M("已删除");});}
function ADAPI(){SEdit("addapi");}
function ADCAT(ai){SEdit("addcat",ai);}
function ADPROD(ai,ci){SEdit("addprod",ai,ci);}
function SEPARAM(ai,ci,pi){ML=3;MA=ai;MC=ci;MP=pi;RM();}
function SVP(ai,ci,pi,i){
  let l=q("pl"+i).value,n=q("pn"+i).value;if(!l||!n){M("参数名不能为空");return;}
  let g=(DATA[ai].categories[ci].products[pi].paramGroups||[])[i];
  g.label=l;g.name=n;sd();ML=3;MP=pi;RM();M("已保存");
}
function DLP(ai,ci,pi,i){CF("确定删除该参数组吗？",function(){let pg=DATA[ai].categories[ci].products[pi];(pg.params||pg.paramGroups).splice(i,1);sd();ML=3;MP=pi;RM();M("已删除");});}
function ADP(ai,ci,pi){let p=DATA[ai].categories[ci].products[pi];let pg=p.paramGroups||[];pg.push({label:"K"+(pg.length+1),name:"新参数",options:[]});sd();ML=3;MP=pi;RM();M("已添加参数组");}
function ADO(ai,ci,pi,i){SEdit("addopt",ai,ci,pi,i);}
function DLO(ai,ci,pi,i,j){CF("确定删除该选项吗？",function(){let pg=DATA[ai].categories[ci].products[pi];(pg.params||pg.paramGroups||[])[i].options.splice(j,1);sd();ML=3;MP=pi;RM();});}
function SEPG(ai,ci,pi,gi){SEdit("pg",ai,ci,pi,gi);}
function SEOPT(ai,ci,pi,gi,oi){SEdit("opt",ai,ci,pi,gi,oi);}

// ===== FILE UPLOAD (存储到本机 uploads 文件夹) =====
function uploadFile(ai,ci,pi){
  let inp=document.createElement("input");
  inp.type="file";
  inp.onchange=function(){
    let f=inp.files[0];
    if(!f)return;
    if(f.size>10*1024*1024){M("文件过大（单个最大 10MB）");return;}
    let reader=new FileReader();
    reader.onload=function(){
      let b64=reader.result.split(",")[1];
      M("正在上传...");
      fetch("/api/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,size:f.size,data:b64})})
      .then(function(r){return r.json()})
      .then(function(res){
        if(res&&res.ok){
          let p=DATA[ai].categories[ci].products[pi];
          if(!p.files)p.files=[];
          p.files.push({name:f.name,url:res.url,size:f.size,time:new Date().toLocaleString()});
          sd();M("✓ 上传成功，已保存到本机");
          SEdit("prod",ai,ci,pi);
        }else{M("上传失败："+((res&&res.err)||"未知错误"));}
      }).catch(function(){M("上传失败：无法连接本地服务，请确认已启动 server.py");});
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function delFile(ai,ci,pi,fi){
  CF("确定删除该文件的记录吗？（本机 uploads 文件夹中的文件将保留）",function(){
    let p=DATA[ai].categories[ci].products[pi];
    if(p.files)p.files.splice(fi,1);
    sd();SEdit("prod",ai,ci,pi);M("已删除附件记录");
  });
}

// ===== 批量导入（标准表格 xlsx） =====
function DL_TMPL(){
  let a=document.createElement("a");
  a.href="/"+encodeURIComponent("产品导入标准表格.xlsx");
  a.download="产品导入标准表格.xlsx";
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function IMPORT_OPEN(){
  let inp=document.createElement("input");
  inp.type="file";
  inp.accept=".xlsx,.xls";
  inp.onchange=function(){
    let f=inp.files[0];
    if(!f)return;
    if(f.size>10*1024*1024){M("文件过大（最大 10MB）");return;}
    let reader=new FileReader();
    reader.onload=function(){
      let b64=reader.result.split(",")[1];
      M("正在导入，请稍候...");
      fetch("/api/import_file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:b64})})
      .then(function(r){return r.json()})
      .then(function(res){
        if(res&&res.ok){
          let s=res.stats||{};
          let errTxt=s.errors&&s.errors.length?("，"+(s.errors.length)+"行有误"):"";
          let msg="✓ 导入完成："+res.rows+" 行数据，新增 标准"+s.api+" 子类"+s.cat+" 产品"+s.prod+" 参数组"+s.pg+" 选项"+s.opt+errTxt;
          M(msg);
          DATA=[];loadAll();
        }else{M("导入失败："+((res&&res.err)||"未知错误"));}
      }).catch(function(){M("导入失败：无法连接本地服务");});
    };
    reader.readAsDataURL(f);
  };
  inp.click();
}
function loadAll(){
  // 从服务器重新加载全部数据并刷新视图
  apiGet().then(function(store){
    if(store&&Array.isArray(store.data)&&store.data.length){DATA=store.data;}
    if(store&&Array.isArray(store.saved)){SAVED=store.saved;}
    RM();R();
  });
}
function SEdit(type,ai,ci,pi,gi,oi){
  let h="",title="";ED={type,ai,ci,pi,gi,oi};
  let getV=(id)=>(q(id)||{}).value||"";
  if(type==="api"||type==="cat"||type==="prod"){
    let item=type==="api"?DATA[ai]:type==="cat"?DATA[ai].categories[ci]:DATA[ai].categories[ci].products[pi];
    if(!item){M("项目不存在");return;}
    title="编辑 "+(type==="api"?"标准":type==="cat"?"子类":"产品");
    h=`<div class="fd"><label>编码</label><input class="in ro" id="ef_c" value="${E(item.code)}" readonly></div>
        <div class="fd"><label>英文名称</label><input class="in" id="ef_n" value="${E(item.name)}"></div>
        <div class="fd"><label>中文名称</label><input class="in" id="ef_cn" value="${E(item.cname||"")}"></div>`;
    if(type==="prod"){
      let fl=item.files||[];
      if(fl.length){
        h+=`<div class="fd"><label>已上传文件 (${fl.length})</label>`;
        fl.forEach(function(fi,idx){
          let sz=fi.size?(fi.size/1024).toFixed(0)+"KB":"";
          h+=`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:6px;background:#f9fafb">
            <a href="${E(fi.url)}" target="_blank" rel="noopener" style="flex:1;font-size:14px;color:#2563eb;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📎 ${E(fi.name)}</a>
            <span style="font-size:11px;color:#9ca3af;flex-shrink:0">${E(sz)}</span>
            <button class="btn btr" onclick="delFile(${ai},${ci},${pi},${idx})" style="font-size:12px;padding:2px 8px;flex-shrink:0">×</button></div>`;
        });
        h+=`</div>`;
      }
      h+=`<div style="text-align:center;margin-top:6px"><button class="btn btb" onclick="uploadFile(${ai},${ci},${pi})" style="width:100%;font-size:14px">📤 上传文件</button>
      <div style="font-size:12px;color:#9ca3af;margin-top:6px">支持图片/PDF/Office 文档，单个最大 10MB，文件保存在本机 uploads 文件夹</div></div>`;
    }
  }else if(type==="addapi"||type==="addcat"||type==="addprod"){
    title="添加 "+(type==="addapi"?"标准":type==="addcat"?"子类":"产品");
    h=`<div class="fd"><label>英文名称 *</label><input class="in" id="ef_n" placeholder="如 API 5CT"></div>
        <div class="fd"><label>中文名称</label><input class="in" id="ef_cn" placeholder="如 套管和油管"></div>`;
  }else if(type==="pg"){
    let g=DATA[ai].categories[ci].products[pi].paramGroups[gi];
    if(!g){M("参数组不存在");return;}
    title="编辑参数组";
    h=`<div class="fd"><label>标签 (如 K1)</label><input class="in" id="ef_c" value="${E(g.label)}"></div>
        <div class="fd"><label>名称</label><input class="in" id="ef_n" value="${E(g.name)}"></div>`;
  }else if(type==="opt"){
    let o=DATA[ai].categories[ci].products[pi].paramGroups[gi].options[oi];
    if(!o){M("选项不存在");return;}
    title="编辑选项";
    h=`<div class="fd"><label>编码</label><input class="in" id="ef_c" value="${E(o.code||o[0])}"></div>
        <div class="fd"><label>描述(中文)</label><input class="in" id="ef_n" value="${E(o.desc||o[1])}"></div>
        <div class="fd"><label>描述(英文)</label><input class="in" id="ef_ne" value="${E(o.desc_en||"")}"></div>`;
  }else if(type==="addopt"){
    title="添加选项";
    h=`<div class="fd"><label>编码 *</label><input class="in" id="ef_c" placeholder="如 45"></div>
        <div class="fd"><label>描述 *</label><input class="in" id="ef_n" placeholder="如 4½in"></div>`;
  }
  q("et").textContent=title;q("ef").innerHTML=h;q("em").classList.add("s");
}
function CE(){q("em").classList.remove("s");}
function SVEd(){
  let t=ED.type,ai=ED.ai,ci=ED.ci,pi=ED.pi,gi=ED.gi,oi=ED.oi;
  let n=getV("ef_n");let cn=getV("ef_cn");let cd=getV("ef_c");
  if(!n){M("名称不能为空");return;}
  if(t==="api"){DATA[ai].name=n;DATA[ai].cname=cn||"";sd();RM();M("已更新");CE();return;}
  if(t==="cat"){DATA[ai].categories[ci].name=n;DATA[ai].categories[ci].cname=cn||"";sd();RM();M("已更新");CE();return;}
  if(t==="prod"){DATA[ai].categories[ci].products[pi].name=n;DATA[ai].categories[ci].products[pi].cname=cn||"";sd();RM();M("已更新");CE();return;}
  if(t==="pg"){let g=DATA[ai].categories[ci].products[pi].paramGroups[gi];g.label=cd;g.name=n;sd();ML=3;MP=pi;RM();M("已更新");CE();return;}
  if(t==="opt"){let o=DATA[ai].categories[ci].products[pi].paramGroups[gi].options[oi];o.code=cd;o.desc=n;let ne=(q("ef_ne")||{}).value||"";if(ne)o.desc_en=ne;sd();ML=3;MP=pi;RM();M("已更新");CE();return;}
  if(t==="addapi"){let cs=DATA.map(x=>x.code);let c=NC1(cs,"A");if(cs.includes(c)){M("标准编码已满(A~Z)");return;}DATA.push({code:c,name:n,cname:cn||"",categories:[]});sd();RM();M("已添加 "+c);CE();return;}
  if(t==="addcat"){let cs=DATA[ai].categories.map(x=>x.code);let c=NC1(cs,"A");if(cs.includes(c)){M("子类编码已满(A~Z)");return;}DATA[ai].categories.push({code:c,name:n,cname:cn||"",products:[]});sd();RM();M("已添加 "+c);CE();return;}
  if(t==="addprod"){
    let ps=DATA[ai].categories[ci].products;let cs=ps.map(x=>x.code);
    // 产品编码双字母 AA~ZZ，子类内顺延（676 个/子类）
    let c=NC2(cs,"AA");
    if(cs.includes(c)){M("产品编码已满(AA~ZZ)");return;}
    ps.push({code:c,name:n,cname:cn||"",paramGroups:[]});
    sd();RM();M("已添加 "+c);CE();return;
  }
  if(t==="addopt"){
    if(!cd){M("编码不能为空");return;}
    let pg=DATA[ai].categories[ci].products[pi].paramGroups||[];
    pg[gi].options.push({code:cd,desc:n});
    sd();ML=3;MP=pi;RM();M("已添加");CE();return;
  }
}
function getV(id){return(q(id)||{}).value||"";}

// ===== CONFIRM MODAL =====
let CF_CB=null;
function CF(msg,cb){CF_CB=cb;q("cfm").textContent=msg;q("cf").classList.add("s");}
function CFOK(){if(CF_CB)CF_CB();CF_CB=null;q("cf").classList.remove("s");}
function CFNO(){CF_CB=null;q("cf").classList.remove("s");}

// ===== INIT =====
function init(){
  q("app").innerHTML=`
    <div><span class="tb on" data-t="en" onclick="TB('en')">🔧 编码器</span><span class="tb" data-t="mg" onclick="TB('mg')">📋 数据管理</span></div>
    <div id="pe"><div style="padding:8px 0;font-size:14px;color:#6b7280">按步骤选择 > 保存编码</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap" class="enc-flex">
        <div style="flex:1;min-width:380px" id="en"></div>
        <div class="gb" style="flex:1;min-width:240px;margin:0">
          <div style="font-size:15px;font-weight:600;color:#166534">✓ 完整编码</div>
          <div id="fc" class="ce"><span style="color:#a0aec0;opacity:.5">尚未选择</span></div>
          <div id="fi"></div>
        </div>
      </div>
      <div id="sv"></div>
    </div>
    <div id="pm" style="display:none"><div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap"><span style="font-weight:700;font-size:18px;color:#111827">📋 数据管理</span><span style="flex:1"></span><button class="btn" onclick="DL_TMPL()" style="font-size:14px;padding:8px 14px">⬇ 下载模板</button><button class="btn bts" onclick="IMPORT_OPEN()" style="font-size:14px;padding:8px 16px;font-weight:600">📥 批量导入</button></div><div id="mg"></div></div>
    <div id="md" class="mk" onclick="if(event.target===this)CM()"><div class="mw"><div class="mh"><span id="mt"></span><span style="cursor:pointer" onclick="CM()">×</span></div><div class="mb" id="mo"></div></div></div>
    <div id="em" class="mk" onclick="if(event.target===this)CE()"><div class="mw" style="max-width:400px"><div class="mh"><span id="et"></span><span style="cursor:pointer" onclick="CE()">×</span></div><div class="mb" id="ef"></div><div class="mf"><button class="btn" onclick="CE()">取消</button><button class="btn bts" onclick="SVEd()">✓ 保存</button></div></div></div>
    <div id="cf" class="mk" onclick="if(event.target===this)CFNO()"><div class="mw" style="max-width:360px"><div class="mh"><span>确认操作</span><span style="cursor:pointer" onclick="CFNO()">×</span></div><div class="mb" id="cfm" style="font-size:16px;line-height:1.7"></div><div class="mf"><button class="btn" onclick="CFNO()">取消</button><button class="btn bts" onclick="CFOK()">✓ 确定</button></div></div></div>`;
  // 本地部署版：优先从磁盘服务器加载数据，服务器为空则用本地缓存并写回（自动迁移）
  apiGet().then(function(store){
    if(store){
      if(Array.isArray(store.data)&&store.data.length){DATA=store.data;}
      if(Array.isArray(store.saved)){SAVED=store.saved;}
      sd();  // 确保磁盘/本地一致
    }else{
      sd();  // 服务器不可用：数据留在浏览器本地（双击打开也可用）
      M("提示：未连接本地服务，数据保存在浏览器中");
    }
    R();RS();if(CT==="mg")RM();
  });
}
init();
</script>
